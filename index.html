<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV – Nama Mahasiswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#0B2B3A;   /* 50% */
  --ivory:#F7F4EA;   /* 25% */
  --teal:#145360;    /* 15% */
  --glass:#A9DDCB;   /* 10% */
  --muted:#4C6A6E;
  --head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);font-size:1rem;line-height:1.6;color:var(--ocean);
  background:radial-gradient(800px 500px at 80% 0,#145360aa,transparent 70%),var(--ocean);
  padding:clamp(.75rem,4vw,3rem) clamp(.5rem,3vw,1.5rem)}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:4px}

/* LEMBAR CV */
.sheet{position:relative;max-width:820px;margin:0 auto;background:var(--ivory);border-radius:26px;overflow:hidden;
  padding:clamp(1.75rem,5vw,3.25rem) clamp(1.25rem,5vw,3.25rem) 9.5rem;box-shadow:0 30px 80px #0008}
.deco{position:absolute;pointer-events:none}
.tr1{top:0;right:0;width:52%;height:130px;background:var(--glass);clip-path:polygon(28% 0,100% 0,100% 100%)}
.tr2{top:0;right:0;width:40%;height:100px;background:var(--ocean);clip-path:polygon(35% 0,100% 0,100% 100%)}
.tr3{top:0;right:0;width:22%;height:60px;background:var(--teal);clip-path:polygon(40% 0,100% 0,100% 100%)}
.bl1{bottom:0;left:0;width:62%;height:100px;background:var(--glass);clip-path:polygon(0 0,100% 100%,0 100%)}
.bl2{bottom:0;left:0;width:48%;height:76px;background:var(--ocean);clip-path:polygon(0 20%,100% 100%,0 100%)}
.br1{bottom:0;right:0;width:46%;height:64px;background:var(--teal);clip-path:polygon(100% 0,100% 100%,0 100%)}
.dots{background:radial-gradient(circle,var(--teal) 2px,transparent 2.6px) 0 0/18px 18px}
.dots--a{top:20px;left:26px;width:170px;height:18px}
.dots--b{right:26px;top:46%;width:40px;height:130px;opacity:.6}

/* HEADER */
.head{position:relative;display:flex;gap:1.75rem;align-items:center;margin-top:1rem;z-index:1}
.photo{flex:none;width:clamp(110px,22vw,150px);aspect-ratio:1;border-radius:16px;background:var(--teal);
  border:3px solid var(--glass);display:grid;place-items:center;overflow:hidden;
  font-family:var(--head);font-weight:800;font-size:3rem;color:var(--glass)}
.photo img{width:100%;height:100%;object-fit:cover}
.head h1{font-family:var(--head);font-weight:800;letter-spacing:-.02em;line-height:1.05;font-size:clamp(1.9rem,6vw,2.9rem)}
.role{font-family:var(--head);font-size:clamp(1.05rem,2.6vw,1.35rem);color:var(--teal);font-weight:500;margin:.2rem 0 .6rem}
.contact{list-style:none;display:grid;gap:.1rem;font-size:.95rem}
.contact a{text-decoration:none;color:var(--ocean)}
.contact a:hover{text-decoration:underline;text-underline-offset:3px}
.contact b{display:inline-block;min-width:4.6rem;color:var(--teal);font-weight:600}

/* SEKSI */
.sec{position:relative;z-index:1}
.pill{display:inline-block;margin:2rem 0 .9rem;padding:.3rem 1.5rem .35rem;background:var(--ocean);color:var(--ivory);
  font-family:var(--head);font-weight:700;font-size:1.3rem;border-radius:10px;box-shadow:inset 0 -3px 0 var(--glass)}
.about{max-width:62ch}
ul.list{list-style:none;display:grid;gap:.35rem}
ul.list li{position:relative;padding-left:1.4rem}
ul.list li::before{content:"";position:absolute;left:.2rem;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.fields{display:grid;gap:.35rem}
.fields div{display:grid;grid-template-columns:9.5rem 1fr;gap:.5rem;padding-left:1.4rem;position:relative}
.fields div::before{content:"";position:absolute;left:.2rem;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.fields dt::after{content:" :";float:right;margin-right:.4rem}
.edu small,.exp small{color:var(--muted)}

/* KARYA */
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.work{background:var(--teal);color:#E9F1EE;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.work__img{aspect-ratio:16/10;background:var(--ocean);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:2rem;color:var(--glass);overflow:hidden}
.work__img img{width:100%;height:100%;object-fit:cover}
.work__body{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.work h3{font-family:var(--head);font-size:1.1rem;line-height:1.2}
.work p{font-size:.92rem;color:#B7CFCC;flex:1}
.work__links{display:flex;gap:1rem;font-size:.92rem;font-weight:600}
.work__links a{color:var(--glass);text-underline-offset:3px}

/* CHIPS */
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem}
.chips li{background:var(--ocean);color:var(--glass);padding:.3rem .95rem;border-radius:999px;font-weight:500;font-size:.95rem}

@media (max-width:600px){
  .head{flex-direction:column;align-items:flex-start;margin-top:2.2rem}
  .fields div{grid-template-columns:1fr;gap:0}
  .fields dt::after{content:":";float:none}
  .dots--b{display:none}
  .sheet{padding-bottom:7.5rem}
}
@media print{
  @page{size:A4;margin:0}
  body{background:none;padding:0}
  .sheet{box-shadow:none;border-radius:0;max-width:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<main class="sheet">
  <i class="deco tr1"></i><i class="deco tr2"></i><i class="deco tr3"></i>
  <i class="deco bl1"></i><i class="deco bl2"></i><i class="deco br1"></i>
  <i class="deco dots dots--a"></i><i class="deco dots dots--b"></i>

  <header class="head">
    <div class="photo" id="photo"></div>
    <div>
      <h1 id="nama"></h1>
      <p class="role" id="peran"></p>
      <ul class="contact" id="kontak"></ul>
    </div>
  </header>

  <section class="sec">
    <h2 class="pill">Profil</h2>
    <p class="about" id="bio"></p>
  </section>

  <section class="sec">
    <h2 class="pill">Data Pribadi</h2>
    <dl class="fields" id="pribadi"></dl>
  </section>

  <section class="sec">
    <h2 class="pill">Pendidikan</h2>
    <ul class="list edu" id="pendidikan"></ul>
  </section>

  <section class="sec">
    <h2 class="pill">Karya</h2>
    <div class="works" id="karya"></div>
  </section>

  <section class="sec">
    <h2 class="pill">Keterampilan</h2>
    <ul class="chips" id="skill"></ul>
  </section>
</main>

/* ====== SELESAI ====== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.title = `CV – ${data.nama}`;
$("nama").textContent = data.nama;
$("peran").textContent = data.peran;
$("bio").textContent = data.bio;

const initials = data.nama.split(" ").slice(0,2).map(n => n[0]).join("").toUpperCase();
$("photo").innerHTML = data.foto ? `<img src="${esc(data.foto)}" alt="Foto ${esc(data.nama)}">` : initials;

$("kontak").innerHTML = data.kontak.map(k =>
  `<li><b>${esc(k.label)}</b><a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.teks)}</a></li>`).join("");

$("pribadi").innerHTML = data.pribadi.map(([l, v]) => `<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join("");

$("pendidikan").innerHTML = data.pendidikan.map(e =>
  `<li>${esc(e.sekolah)}${e.detail ? `<br><small>${esc(e.detail)}</small>` : ""}</li>`).join("");

$("karya").innerHTML = data.karya.map(k => `
  <article class="work">
    ${k.gambar ? `<div class="work__img"><img src="${esc(k.gambar)}" alt="Tampilan ${esc(k.judul)}" loading="lazy"></div>` : ""}
    <div class="work__body">
      <h3>${esc(k.judul)}</h3>
      <p>${esc(k.deskripsi)}</p>
    </div>
  </article>`).join("");

$("skill").innerHTML = data.keterampilan.map(s => `<li>${esc(s)}</li>`).join("");
